name: pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Build site
        run: |
          set -euo pipefail
          mkdir -p _site
          links=""
          shopt -s nullglob
          for d in demos/*/; do
            name=$(basename "$d")
            if [ -f "$d/package.json" ]; then
              (cd "$d" && npm ci && npm run build)
              cp -r "$d/dist" "_site/$name"
            else
              cp -r "$d" "_site/$name"
            fi
            links="$links<li><a href=\"./$name/\">$name</a></li>"
          done
          [ -z "$links" ] && links="<li>No demos yet.</li>"
          printf '<!doctype html><html><head><meta charset="utf-8"><title>demos</title></head><body><h1>demos</h1><ul>%s</ul></body></html>\n' "$links" > _site/index.html
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
